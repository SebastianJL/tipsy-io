[project]
name = "tipsy-io"
version = "0.2.0"
description = "Read and write tipsy files as numpy arrays."
authors = [
    { name = "SebastianJL", email = "johannes.lade@yahoo.com" },
    { name = "Douglas Potter", email = "douglas.potter@uzh.ch" },
]
requires-python = ">=3.14,<4"
readme = "README.md"
maintainers = [{ name = "SebastianJL", email = "johannes.lade@yahoo.com" }]
keywords = [
    "tipsy",
    "io",
    "read",
    "write",
]
classifiers = [
    "Topic :: File Formats",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy~=2.0",
]

[project.urls]
Repository = "https://github.com/SebastianJL/tipsy-io"
Documentation = "https://sebastianjl.github.io/tipsy-io/"

[dependency-groups]
test = ["pytest~=9.0"]
doc = ["pdoc>=14.1.0,<15"]

[tool.uv]
default-groups = "all"
package = true

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
